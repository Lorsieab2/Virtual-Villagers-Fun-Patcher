name: translation-record

# When translations/ changes on the default branch (the owner merged a translation pull request, or committed
# one), every file there is scanned again with VirusTotal where its SHA-256 is not already recorded clean, and
# validated; translations/manifest.json is rewritten with each clean, valid file's sha256, scan date and
# verdict. The patcher's Download from GitHub... offers only files listed clean in it, and refuses any file
# whose hash is not. A flagged or unscanned file is simply left out (and named in the run's log).
#
# Security: this runs on the repository's own default branch (trusted code); the translation files are only
# read as data. Only contents may write. VT_API_KEY is a secret passed as an environment variable to the one
# step that needs it and never printed. The commit is made with the workflow's own token, which does not start
# this workflow again.
on:
  push:
    branches: [main]
    paths:
      - 'translations/**'
      - '!translations/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan and validate every translation; write the manifest
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          WORK: ${{ runner.temp }}/record
        run: python -I scripts/translation_submissions.py record
      - name: Commit the manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add -- translations/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "translations: record the scanned files"
            git push origin HEAD
          fi
