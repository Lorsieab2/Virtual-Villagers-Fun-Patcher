name: tests

# The suite is the project's safety net -- it is what proves a manifest edit
# still lands the bytes it claims. Until now nothing ran it automatically, so
# a regression could only be caught by whoever remembered to run it locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Windows, because the patcher is a Windows tool and says so in code: the
    # VV3 and VV5 identity-atomic operations raise PatcherError unless they are
    # on 64-bit Windows. On ubuntu-latest that is 51 failures which are not
    # defects -- the suite is correctly refusing to certify behaviour on a
    # platform the tool does not support.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache hashes a dependency file and fails the
          # step when none matches, so it must name a real one.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the suite
        # The stock game executables are gitignored and must never be
        # committed, so a CI checkout cannot have them. tests/conftest.py
        # reports those tests as skipped rather than failed, which is what
        # makes this run meaningful: red here is a real regression, not a
        # checkout missing game files it is not allowed to carry.
        #
        # VVFP_ALLOW_MISSING_FIXTURES is set for exactly that reason. The
        # session guard added alongside it refuses to exit 0 when tests were
        # skipped for absent game files, because on a DEVELOPER machine that
        # silence is a lie -- a fresh worktree lacks the binaries and the suite
        # still passes, which was read as evidence about the code three times
        # in one day. Here the absence is structural and permitted, so the
        # guard is opted out of rather than satisfied.
        #
        # The consequence is worth stating where someone will read it: this
        # run genuinely does not examine the game binaries. It skipped 225
        # tests for want of them, against 81 skips on a machine that has them.
        # A green CI run is evidence about the code that does not need the
        # executables, and nothing more.
        env:
          VVFP_ALLOW_MISSING_FIXTURES: "1"
        run: python -m pytest tests/ -q
