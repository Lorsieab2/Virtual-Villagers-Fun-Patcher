name: tests

# The suite is the project's safety net -- it is what proves a manifest edit
# still lands the bytes it claims. Until now nothing ran it automatically, so
# a regression could only be caught by whoever remembered to run it locally.
#
# WHAT A GREEN RUN HERE DOES AND DOES NOT MEAN.
#
# The stock game executables are gitignored -- they are copyrighted and must
# never be committed -- so this checkout cannot have them and the tests that
# read them skip. That is permitted and expected, not a defect to fix. But
# skipping is invisible in the exit status, so a green check here is evidence
# about the code that does NOT need the executables, and nothing more.
#
# The gap is not a random sample. Measured by moving the executables aside on
# a machine that has them:
#
#   with the executables    1342 passed, 123 skipped
#   without them (here)     1176 passed, 376 skipped
#
# The ~166 tests that never run are the layer that verifies PATCHED OUTPUT --
# StockIntegrationTests, ManifestTests, the per-game feature suites, and
# PublishLeavesRoomForCrashImmunityTests, whose ten subtests catch a wrapper
# splitting the executable zero run and breaking publish-time name-crash
# immunity. That guard has never executed in CI, in any game.
#
# So CI validates the Python that builds patches, not the patches themselves.
# Byte-level guarantees rest on a local run with the executables linked, and a
# reviewer reading a green check should not infer otherwise.
#
# The exact count depends on the tree (`inputs/` contents differ per machine);
# the composition does not.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Windows, because the patcher is a Windows tool and says so in code: the
    # VV3 and VV5 identity-atomic operations raise PatcherError unless they are
    # on 64-bit Windows. On ubuntu-latest that is 51 failures which are not
    # defects -- the suite is correctly refusing to certify behaviour on a
    # platform the tool does not support.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache hashes a dependency file and fails the
          # step when none matches, so it must name a real one.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the suite
        # The stock game executables are gitignored and must never be
        # committed, so a CI checkout cannot have them. tests/conftest.py
        # reports those tests as skipped rather than failed, which is what
        # makes this run meaningful: red here is a real regression, not a
        # checkout missing game files it is not allowed to carry.
        run: python -m pytest tests/ -q
