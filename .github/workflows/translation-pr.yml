name: translation-pr

# A pull request that adds or changes a file in the public translations/ folder (anyone can open one with
# GitHub's "Add file -> Upload files"; translations/README.md explains it). Two required checks, in order:
#   1. scan     -- every submitted file's shape (translations/vv1..vv5/<code>.tsv, UTF-8, at most 2 MB), then
#                  VirusTotal (scripts/virustotal_scan.py). Flagged, or NOT SCANNED for any reason, fails.
#   2. validate -- only after a clean scan: the patcher's own validator (scripts/validate_translation.py).
# The results are commented on the pull request. The owner accepts by merging, or by adding the
# "accept-translation" label: the files are scanned and validated AGAIN, then the pull request is merged and
# translations/manifest.json (what Download from GitHub... trusts) is written. A failing check removes the label.
#
# Security -- the pull request's files are written by strangers:
# - `pull_request_target` runs THIS workflow as it is on the default branch, never the pull request's version,
#   and `actions/checkout` checks out the DEFAULT branch only (no ref to the pull request's head). Nothing of
#   the pull request is checked out, installed, imported or run: its files are read as DATA through the
#   GitHub API, blob by blob, into a scratch folder (scripts/translation_submissions.py fetch-pr), decoded as
#   text and parsed. This is why the VirusTotal key (a secret) is safe here, and why pull requests from forks
#   are scanned at all (the `pull_request` event gives a fork's run no secrets, so every fork submission
#   would fail as "not scanned").
# - Permissions: only contents, pull-requests and issues may write, and each job asks for no more than it needs.
# - Nothing from the pull request (title, body, branch or file names) is interpolated into a run: script;
#   numbers and names reach the scripts through environment variables only.
# - VT_API_KEY is a repository secret, passed as an environment variable to the one step that needs it; the
#   script sends it only in the x-apikey header and never prints it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'translations/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: translation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.action != 'labeled' || github.event.label.name == 'accept-translation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.scan.outputs.scan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the submitted files as data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORK: ${{ runner.temp }}/submission
        run: python -I scripts/translation_submissions.py fetch-pr
      - name: VirusTotal scan
        id: scan
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          WORK: ${{ runner.temp }}/submission
        run: python -I scripts/translation_submissions.py scan
      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: ${{ runner.temp }}/submission/scan.md
          if-no-files-found: ignore

  validate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the submitted files as data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORK: ${{ runner.temp }}/submission
        run: python -I scripts/translation_submissions.py fetch-pr
      - name: Validate
        shell: bash
        env:
          WORK: ${{ runner.temp }}/submission
        run: python -I scripts/translation_submissions.py validate
      - name: Keep the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-report
          path: ${{ runner.temp }}/submission/validate.md
          if-no-files-found: ignore

  report:
    needs: [scan, validate]
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/reports
      - name: Comment the results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORTS: ${{ runner.temp }}/reports
          SCAN: ${{ needs.scan.result }}
          VALIDATE: ${{ needs.validate.result }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/comment.md"
          printf '## Translation checks\n\nVirusTotal scan: **%s**. Validator: **%s**.\n\n' "$SCAN" "$VALIDATE" > "$out"
          for f in "$REPORTS/scan-report/scan.md" "$REPORTS/validate-report/validate.md"; do
            if [ -s "$f" ]; then cat "$f" >> "$out"; printf '\n' >> "$out"; fi
          done
          if [ "$SCAN" != "success" ] && [ ! -s "$REPORTS/scan-report/scan.md" ]; then
            printf 'The scan did not finish, so the files are **not scanned** and refused.\n' >> "$out"
          fi
          gh pr comment "$PR_NUMBER" --body-file "$out"
          if [ "$LABEL" = "accept-translation" ] && { [ "$SCAN" != "success" ] || [ "$VALIDATE" != "success" ]; }; then
            gh pr edit "$PR_NUMBER" --remove-label accept-translation
            printf 'The accept-translation label was removed: a file did not pass both checks, so it cannot be accepted.\n' > "$RUNNER_TEMP/refused.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/refused.md"
          fi

  accept:
    needs: [scan, validate]
    if: github.event.action == 'labeled' && github.event.label.name == 'accept-translation' && needs.scan.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan again and record the manifest
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          WORK: ${{ runner.temp }}/record
        run: python -I scripts/translation_submissions.py record
      - name: Commit the manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add -- translations/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "translations: record the scanned files"
            git push origin HEAD
          fi
